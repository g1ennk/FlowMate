spring:
  application:
    name: backend
  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 900        # 15분
  guest-ttl: 7776000     # 90일
  state-ttl: 300         # 5분
  refresh-ttl: 1209600   # 14일

cookie:
  secure: ${COOKIE_SECURE:false}   # 프로덕션(HTTPS)에서는 true

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  authorize-url: https://kauth.kakao.com/oauth/authorize
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-2.5-flash
  # Nginx /api proxy_read_timeout(60s)보다 먼저 끝나도록 잡는다.
  # 최악 = connection-request 1s + connect 3s + read 45s = 49s
  connection-request-timeout-ms: ${GEMINI_CONNECTION_REQUEST_TIMEOUT_MS:1000}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:45000}
  max-connections: ${GEMINI_MAX_CONNECTIONS:20}

# AI 리포트 생성 보호 (Redis). Redis 장애 시 lock과 rate limit 모두 fail-open
report:
  guard:
    lock-ttl: 60s        # Gemini 최악 49s + 저장 여유. 짧으면 시작 시 실패
    user-limit: 10       # 사용자당 window 안 Gemini 호출 수
    user-window: 1h
    cooldown: 30s        # 같은 기간 리포트 생성 성공 후 재생성 대기