# FlowMate Local (실사용) Nginx configuration
# - 프론트(SPA)와 API를 단일 오리진(http://localhost:8180)으로 서빙
# - 여기서는 TLS를 종단하지 않는다. 맥에서는 localhost라 브라우저가 이미 secure context로 취급하고,
#   모바일 접속은 tailscale serve가 앞단에서 TLS를 종단해 이 8180으로 평문 프록시한다
#   (설정은 infra/local/docker-compose.yml 헤더 참고).
# - server_name은 localhost지만 server 블록이 하나뿐이라 default_server로서 ts.net 호스트도 함께 받는다.
# - infra/prod/config/nginx/nginx.conf 기반. proxy_pass 대상만 backend 컨테이너로,
#   정적 서빙 블록은 S3+CloudFront가 하던 역할을 대신하도록 복원했다.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # SSE: 버퍼링 비활성화 + 장기 연결 유지 (prod에서 v1.3.0 타임아웃 사고 이후 확정된 설정)
    location = /api/timer/sse {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        add_header X-Accel-Buffering no always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    location /actuator {
        deny all;
        return 403;
    }

    # index.html / 서비스워커는 항상 재검증 (CI의 2-pass S3 캐시 정책과 동일한 의도)
    location ~* ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback — 딥링크(/settings 등)를 index.html로 (CloudFront 403/404 커스텀 에러 응답 대체)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}
