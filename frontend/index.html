<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e" />
    <!-- 앱 JS보다 먼저 테마를 적용해 첫 화면 깜빡임을 막는다 (키·규칙은 src/store/themeStore.ts와 같다) -->
    <script>
      try {
        const savedTheme = localStorage.getItem('flowmate/ui/theme')
        if (savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = savedTheme === 'dark' ? '#1e1e1e' : '#fafafa'
          })
        }
      } catch (e) {}
    </script>
    <meta name="description" content="할 일 관리와 뽀모도로 타이머를 결합한 생산성 앱" />
    
    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlowMate" />
    
    <title>Flow Mate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
