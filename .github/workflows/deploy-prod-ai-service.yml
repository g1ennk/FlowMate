name: Deploy AI Service (prod)

on:
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: flowmate-ai-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: flowmate-prod-ec2-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./ai-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          AI_SERVICE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          IMAGE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          envs: AI_SERVICE_IMAGE,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/FlowMate
            git fetch --all --tags
            git checkout main
            git reset --hard "$IMAGE_TAG"
            cd infra/prod

            docker run --rm \
              -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              -e AWS_DEFAULT_REGION='${{ env.AWS_REGION }}' \
              amazon/aws-cli:2.31.18 \
              ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
            AI_SERVICE_IMAGE="$AI_SERVICE_IMAGE" docker compose pull ai-service
            AI_SERVICE_IMAGE="$AI_SERVICE_IMAGE" docker compose up -d --remove-orphans ai-service postgres
            docker compose ps ai-service postgres
