name: Deploy Backend (prod)

on:
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: flowmate-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: flowmate-prod-ec2-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ECR_IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          IMAGE_TAG: ${{ github.ref_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION_ENV: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          envs: ECR_IMAGE_URI,IMAGE_TAG,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_ACCOUNT_ID,AWS_REGION_ENV
          script: |
            set -euo pipefail
            cd ~/FlowMate
            git fetch --all --tags
            git checkout main
            git reset --hard "$IMAGE_TAG"
            cd infra/prod

            docker run --rm \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION="$AWS_REGION_ENV" \
              amazon/aws-cli:2.31.18 \
              ecr get-login-password --region "$AWS_REGION_ENV" | \
              docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID".dkr.ecr.ap-northeast-2.amazonaws.com
            ECR_IMAGE_URI="$ECR_IMAGE_URI" docker compose pull backend
            ECR_IMAGE_URI="$ECR_IMAGE_URI" docker compose up -d --remove-orphans backend
            ECR_IMAGE_URI="$ECR_IMAGE_URI" docker compose up -d --force-recreate alloy
            docker compose ps backend
            docker image prune -af --filter "until=24h"
